<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Encontro com Deus</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#5b3fd1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Encontro">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icones/icone-192.png">
  <link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css?v=2.1.1">
</head>
<body>
  <div class="app">
    <header class="topo">
      <div class="marca">
        <img src="icones/icone-192.png" alt="" class="logo">
        <div class="marca-txt">
          <strong id="tituloEvento">Encontro com Deus</strong>
          <button id="statusSync" class="sync" data-acao="sincronizar" title="Sincronização">—</button>
        </div>
      </div>
      <nav class="nav-topo" aria-label="Telas">
        <a href="#painel" data-tela="painel">Painel</a>
        <a href="#recepcao" data-tela="recepcao">Recepção</a>
        <a href="#quartos" data-tela="quartos">Quartos</a>
        <a href="#ajustes" data-tela="ajustes">Ajustes</a>
      </nav>
      <div class="topo-acoes">
        <button class="icone-btn" data-acao="recarregar" title="Atualizar agora" aria-label="Atualizar agora">
          <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
        </button>
        <button class="btn primario so-pc" data-acao="novoCadastro">+ Cadastrar</button>
      </div>
    </header>

    <div id="faixaDemo" class="faixa" hidden>Modo demonstração · dados fictícios <a href="#ajustes">Conectar planilha</a></div>
    <div id="faixaOffline" class="faixa offline" hidden>Sem internet — as ações ficam guardadas e serão enviadas quando a conexão voltar.</div>

    <main id="conteudo">
      <section id="tela-painel" class="tela" hidden></section>

      <section id="tela-recepcao" class="tela" hidden>
        <div class="recepcao-topo">
          <div class="campo-busca">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="busca" type="search" placeholder="Nome, código, celular ou líder" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
            <button id="limparBusca" class="limpar" aria-label="Limpar busca" hidden>×</button>
          </div>
          <div class="chips rolavel" id="filtrosRecepcao"></div>
          <div class="progresso-linha" id="progressoPresenca"></div>
        </div>
        <div id="listaRecepcao" class="lista"></div>
      </section>

      <section id="tela-quartos" class="tela" hidden></section>

      <section id="tela-ajustes" class="tela" hidden></section>
    </main>

    <nav class="nav-baixo" aria-label="Telas">
      <a href="#painel" data-tela="painel">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        <span>Painel</span>
      </a>
      <a href="#recepcao" data-tela="recepcao">
        <svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>
        <span>Recepção</span>
      </a>
      <button class="fab" data-acao="novoCadastro" aria-label="Cadastrar">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <a href="#quartos" data-tela="quartos">
        <svg viewBox="0 0 24 24"><path d="M3 19V6M3 15h18v4M21 15v-3a3 3 0 0 0-3-3h-7v6"/><circle cx="7" cy="11" r="2"/></svg>
        <span>Quartos</span>
      </a>
      <a href="#ajustes" data-tela="ajustes">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        <span>Ajustes</span>
      </a>
    </nav>
  </div>

  <!-- Folha (bottom sheet no celular, janela no PC) -->
  <dialog id="folha" class="folha">
    <form method="dialog" id="folhaForm" novalidate>
      <div class="folha-alca" aria-hidden="true"></div>
      <div class="folha-topo">
        <h2 id="folhaTitulo"></h2>
        <button type="button" class="icone-btn" id="fecharFolha" aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div id="folhaCorpo" class="folha-corpo"></div>
      <div id="folhaBotoes" class="folha-botoes"></div>
    </form>
  </dialog>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="sucesso" class="sucesso" hidden><div class="sucesso-circ"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><div id="sucessoTxt"></div></div>

  <script src="app.js?v=2.1.1"></script>
</body>
</html>
